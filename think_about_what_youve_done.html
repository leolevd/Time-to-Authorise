<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Time to Authorise | Hack Club</title>
    <style>
        :root {
            --bg: #080b08;
            --panel: #101710;
            --text: #eaf7eb;
            --muted: #b8d9bb;
            --accent: #7cff7c;
            --accent-strong: #4afc4a;
        }


        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg);
            color: var(--text);
            font-family: Arial, Helvetica, sans-serif;
        }

        #dialouge {
            width: min(90vw, 780px);
            margin: 0 auto;
            padding: 2rem 1.5rem;
            text-align: center;
            font-size: clamp(1.3rem, 2.5vw, 2.5rem);
            line-height: 1.45;
            color: var(--muted);
            text-shadow: 0 0 10px rgba(124, 255, 124, 0.15);
        }
    </style>
</head>
<body>
    <div style="color: lime; background-color: black; border: 1px solid lime; width: 140px; height: 60px; text-align: center; display: flex; align-items: center; justify-content: center; position: fixed; z-index: 9999; left: 0; top: 0; ">
        <p style="font-size: 24px; font-weight: 700; font-family: monospace; ">ENDING #4</p>
    </div>
    <p id="dialouge"></p>
    <script>
        const p = document.querySelector('p#dialouge');
        p.textContent = "And?"
        setTimeout(() => {
            p.textContent = "Why you always want to ruin everything?"
            setTimeout(() => {
                p.textContent = "THIS SITE"
                setTimeout(() => {
                    p.textContent = "THIS SITE I PUT SO MUCH EFFORT IN"
                    setTimeout(() => {
                        p.textContent = "WHY YOU ALWAYS WANT TO RUIN EVERYTHING?"
                        setTimeout(() => {
                            p.textContent = "WHY???"
                            setTimeout(() => {
                                p.textContent = "IS IT FUN TO YOU?"
                                setTimeout(() => {
                                    p.textContent = "ALL FUN AND JOKES?"
                                    setTimeout(() => {
                                        p.textContent = "YOU THANKLESS PERSON"
                                        setTimeout(() => {
                                            p.textContent = "BUT I NEVER"
                                            setTimeout(() => {
                                                p.textContent = "GONNA"
                                                setTimeout(() => {
                                                    p.textContent = "GIVE"
                                                    setTimeout(() => {
                                                        p.textContent = "YOU"
                                                        setTimeout(() => {
                                                            p.textContent = "UP"
                                                            setTimeout(() => {
                                                                p.textContent = "Oh yeah... Not so funny now you've been rickrolled, huh?"
                                                                setTimeout(() => {
                                                                    p.textContent = "Well, There is one more thing I want to say..."
                                                                    setTimeout(() => {
                                                                        p.textContent = "You deserve it."
                                                                        setTimeout(() => {
                                                                            window.open('https://www.youtube.com/watch?v=dQw4w9WgXcQ', '_blank');
                                                                            setTimeout(() => {
                                                                                location.href='index.html'
                                                                            }, 6000)
                                                                        }, 2000)
                                                                    }, 2000)
                                                                }, 2000)
                                                            }, 2000)
                                                        }, 500)
                                                    }, 500)
                                                }, 500)
                                            }, 500)
                                        }, 2000)
                                    }, 2000)
                                }, 2000)
                            }, 2000)
                        }, 2000)
                    }, 2000)
                }, 2000)
            }, 2000)
        }, 2000)
    </script>
</body>
</html>
