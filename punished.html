<!DOCTYPE html>
<html lang="en">
<head>

<body>
    <h1>STOP IT!</h1>

        let p = document.querySelector('p');
        let clicks = 0;
        const maxClicks = 10;
        p.addEventListener('click', () => {
            clicks++;
            if (clicks <= maxClicks) {
                p.textContent = "ouch ".repeat(clicks) ;
            } else {
                p.textContent = "Fine. You win.";
                after(2000).then(() => {
                    p.textContent = "You are now free to go.";
                    after(2000).then(() => {
                        p.textContent = "You may now leave this page.";
                        after(2000).then(() => {
                            p.textContent = "Goodbye.";
                            after(2000).then(() => {
                                p.textContent = "Seriously, leave now.";
                                after(2000).then(() => {
                                    p.textContent = "This is your last warning.";
                                    after(2000).then(() => {
                                        p.textContent = "LEAVE!";
                                        after(2000).then(() => {
                                            p.textContent = "I mean it.";
                                            after(2000).then(() => {
                                                p.textContent = "Please.";
                                                after(2000).then(() => {
                                                    p.textContent = "Goodbye.";
                                                    after(2000).then(() => {
                                                        window.location.href = "https://google.com";
                                                    })
                                                });
                                            });
                                        });
                                    });
                                });
                            });
                        });
                    });
                });
            }
        });
    </script>
